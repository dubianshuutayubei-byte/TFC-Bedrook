name: Static Pack Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON and manifests
        run: node tools/validate-pack.mjs --allow-empty
      - name: Check JavaScript syntax
        shell: bash
        run: |
          mapfile -t files < <(find packs -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No addon scripts found yet; syntax check will run when scripts are added."
          else
            for file in "${files[@]}"; do
              node --check "$file"
            done
          fi
